<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only dark" />
    <meta name="theme-color" content="#07050f" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary SEO -->
    <title>Persist | Advancing Greatness</title>
    <meta
      name="description"
      content="Persist Foundry backs ambitious founders with capital, structure, and operators. A founder-staking program — Cohort 2026 open. Advancing greatness."
    />
    <meta
      name="keywords"
      content="Persist, Persist Foundry, founder staking, startup accelerator, venture studio, fellowship, entrepreneurship, Cohort 2026"
    />
    <meta name="author" content="Persist Foundry" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://persist.org/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/pv-favicon.png" />
    <link rel="apple-touch-icon" href="/pv-favicon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Persist" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://persist.org/" />
    <meta property="og:title" content="Persist | Advancing Greatness" />
    <meta
      property="og:description"
      content="We back the bet you already made. Capital, structure, and a team that helps you become the company you set out to build. Cohort 2026 open."
    />
    <meta property="og:image" content="https://persist.org/seo/og-image.png" />
    <meta property="og:image:secure_url" content="https://persist.org/seo/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Persist — Advancing Greatness" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@persistventures" />
    <meta name="twitter:creator" content="@persistventures" />
    <meta name="twitter:title" content="Persist | Advancing Greatness" />
    <meta
      name="twitter:description"
      content="We back the bet you already made. Capital, structure, and a team that helps you become the company you set out to build. Cohort 2026 open."
    />
    <meta name="twitter:image" content="https://persist.org/seo/twitter-image.png" />
    <meta name="twitter:image:alt" content="Persist — Advancing Greatness" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Persist",
        "alternateName": "Persist Foundry",
        "url": "https://persist.org/",
        "logo": "https://persist.org/pv-favicon.png",
        "image": "https://persist.org/seo/og-image.png",
        "description": "Persist Foundry backs ambitious founders with capital, structure, and operators. Advancing greatness.",
        "sameAs": [
          "https://www.linkedin.com/company/persist-ventures/",
          "https://www.instagram.com/persistventures/",
          "https://www.youtube.com/@persistventures",
          "https://x.com/persistventures"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
